# Simulated-supervisor parameters and their sources (compiled 2026-09-17).
# "grounded" = taken from a public dataset or publication; "assumption" = modelling choice, swept in experiments.

trust_dynamics:
  model: "Beta(alpha, beta); trust = alpha/(alpha+beta); success: alpha += w_s; failure: beta += w_f"
  source: "Guo & Yang (2020) Int J Soc Robot, doi:10.1007/s12369-020-00703-3, Eq. (1)-(3); arXiv:2007.13151 (local copy: guo_yang_2020_trust_2007.13151.pdf)"
  status: grounded
  illustrative_values: {w_s: 20, w_f: 50}   # values used in the paper's illustration (Fig. 3 text)
  empirical_findings: "fitted w_f > w_s for most participants; alpha_0 mean > beta_0 mean (positive initial attitude)"
  sweep: {w_s: [20], w_f: [20, 50], alpha_0: [100], beta_0: [50]}  # alpha_0/beta_0 chosen as assumption respecting alpha_0 > beta_0

reaction_delay:
  source: "Zhang, de Winter, Varotto, Happee, Martens (2019) Transportation Research Part F 64:285-307, doi:10.1016/j.trf.2019.04.020"
  status: grounded
  findings:
    - "average reported take-over time across 129 studies is 2.7 s"
    - "mean and SD of take-over time are highly correlated"
    - "auditory or vibrotactile take-over requests give shorter take-over times than visual-only or no request"
  control_dt_s: 0.1
  sweep_seconds: [0.5, 1.5, 2.7]   # 2.7 s anchored to the meta-analysis average; lower levels are assumptions for a slow tabletop task
  distribution: "lognormal with SD proportional to mean (assumption consistent with the mean-SD correlation)"

operator_skill:
  source: "robomimic multi-human (MH) datasets, Mandlekar et al. (2021) CoRL, arXiv:2108.03298; 6 operators: 2 worse, 2 okay, 2 better; 50 demos each"
  status: grounded (fitted in src/uhitl/calibration.py)
  levels: [worse, okay, better]

attention:
  status: assumption
  sweep_p_attend: [0.3, 0.6, 0.9]

request_reliance:
  status: assumption
  sweep_c: [0.0, 0.3, 0.6]
